<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5ec8ff">
<title>Punchy Wobblers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1440;--panel:#ffffff;--muted:#6b6290;--gold:#ffc83d;--red:#ff4d6d;--blue:#3d8bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#5ec8ff;font-family:Fredoka,system-ui,sans-serif;color:var(--ink);touch-action:none}
canvas{display:block;position:fixed;inset:0}
.title{font-family:'Lilita One',Fredoka,sans-serif;letter-spacing:1px}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(8px + env(safe-area-inset-top)) 10px 0;pointer-events:none;z-index:5}
.side{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.side.r{align-items:flex-end}
.name{font-family:'Lilita One',sans-serif;font-size:clamp(14px,3.6vw,22px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:4px}
.pip{width:clamp(12px,3vw,18px);height:clamp(12px,3vw,18px);border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(0,0,0,.25)}
.pip.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
#mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
.ibtn{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:3px solid rgba(0,0,0,.18);background:rgba(255,255,255,.9);font-size:18px;cursor:pointer;color:var(--ink);font-family:inherit;font-weight:700}
#roundTag{font-family:'Lilita One',sans-serif;color:#fff;font-size:14px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:6;opacity:0}
#banner .b1{font-family:'Lilita One',sans-serif;font-size:clamp(34px,9vw,72px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
#banner .b2{font-family:'Lilita One',sans-serif;font-size:clamp(16px,4.2vw,28px);color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;margin-top:4px}
#banner.show{animation:ban 1.5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(2deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(0)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
#touchHint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;pointer-events:none;z-index:4;opacity:.9}
#touchHint div{font-family:'Lilita One',sans-serif;color:#fff;font-size:15px;background:rgba(29,20,64,.35);border-radius:14px;padding:6px 12px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(29,20,64,.45);padding:12px}
.overlay.show{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.card{background:#fff;border:4px solid var(--ink);border-radius:26px;padding:18px;width:100%;max-width:440px;max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 0 var(--ink),0 24px 50px rgba(0,0,0,.35);touch-action:pan-y}
.card h1{font-family:'Lilita One',sans-serif;margin:0;font-size:30px;text-align:center;font-weight:400}
.card .muted{color:var(--muted);font-size:14px;text-align:center}
.logo{font-family:'Lilita One',sans-serif;text-align:center;line-height:.86;margin:0}
.logo span{display:block;font-size:52px;color:#ffcf3d;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.logo span+span{color:#ff5d8f;transform:rotate(-3deg)}
.btn{pointer-events:auto;border:4px solid var(--ink);border-radius:18px;padding:11px 14px;font-family:'Lilita One',sans-serif;font-size:21px;color:var(--ink);background:#ffcf3d;box-shadow:0 5px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:transform .07s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn small{font-family:Fredoka,sans-serif;font-weight:600;font-size:12px;opacity:.85}
.btn.blue{background:#5ec8ff}.btn.pink{background:#ff8fb3}.btn.green{background:#7ff0a4}.btn.white{background:#fff}.btn.purple{background:#b9a2ff}
.btn[disabled]{filter:grayscale(.8) opacity(.7);pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mL,.mR{display:flex;flex-direction:column;gap:10px}
.coinBar{display:flex;justify-content:center;gap:8px;align-items:center;font-family:'Lilita One',sans-serif;font-size:20px}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc83d 55%,#d68a00);border:2px solid var(--ink);vertical-align:-3px}
.ladder{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;touch-action:pan-x}
.lad{flex:0 0 auto;width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;opacity:.45}
.lad canvas{position:static;width:58px;height:58px;border-radius:14px;background:#e9f6ff;border:3px solid var(--ink)}
.lad.done{opacity:.8}.lad.cur{opacity:1}.lad.cur canvas{background:#fff1c2;box-shadow:0 0 0 3px var(--gold)}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sk{position:relative;border:3px solid var(--ink);border-radius:16px;background:#e9f6ff;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-family:inherit;color:var(--ink)}
.sk canvas{position:static;width:64px;height:64px}
.sk .nm{font-size:11px;font-weight:700}
.sk .pr{font-size:12px;font-weight:700}
.sk.sel{background:#fff1c2;box-shadow:0 0 0 3px var(--gold)}
.sk.lock canvas{filter:brightness(.25)}
.vs{display:flex;align-items:center;justify-content:center;gap:10px}
.vs canvas{position:static;width:110px;height:110px}
.vs b{font-family:'Lilita One',sans-serif;font-size:34px;color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.big{font-family:'Lilita One',sans-serif;font-size:44px;text-align:center;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;color:#ffcf3d;text-shadow:0 5px 0 var(--ink)}
.row{display:flex;gap:10px;align-items:center;justify-content:center}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;text-align:center}
.keys div{background:#e9f6ff;border:3px solid var(--ink);border-radius:14px;padding:8px}
kbd{display:inline-block;border:2px solid var(--ink);border-bottom-width:4px;border-radius:8px;padding:1px 7px;font-family:'Lilita One',sans-serif;background:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);padding:8px 14px;border-radius:14px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dd{border:3px solid var(--ink);border-radius:14px;background:#e9f6ff;padding:6px;text-align:center;font-weight:700;font-size:13px}
.dd.now{background:#fff1c2;box-shadow:0 0 0 3px var(--gold)}
.badge{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:10px;font-size:12px;padding:0 6px;display:none}
.badge.show{display:block}.rel{position:relative}
body.land #scrMenu .card{flex-direction:row;max-width:780px;align-items:center;gap:18px}
body.land #scrMenu .mL,body.land #scrMenu .mR{flex:1;min-width:0}
body.land .card{max-width:640px}
body.land .skins{grid-template-columns:repeat(6,1fr)}
#adScreen .adBox{background:#000;color:#fff;border-radius:16px;padding:20px;text-align:center;width:100%;max-width:360px}
body.adbusy::after{content:'';position:fixed;inset:0;z-index:100}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" style="display:none">
  <div class="side"><div class="name" id="n1">You</div><div class="pips" id="pips1"></div></div>
  <div id="mid"><button class="ibtn" id="pauseBtn" aria-label="Pause">❚❚</button><div id="roundTag"></div></div>
  <div class="side r"><div class="name" id="n2">CPU</div><div class="pips" id="pips2"></div></div>
</div>
<div id="banner"><div class="b1" id="b1"></div><div class="b2" id="b2"></div></div>
<div id="touchHint" style="display:none"></div>
<div id="toast"></div>

<div class="overlay show" id="scrMenu"><div class="card">
  <div class="mL">
    <div class="logo"><span>PUNCHY</span><span>WOBBLERS</span></div>
    <div class="vs"><canvas id="menuA" width="220" height="220"></canvas><b>VS</b><canvas id="menuB" width="220" height="220"></canvas></div>
    <div class="coinBar"><span class="coin"></span><span id="menuCoins">0</span></div>
  </div>
  <div class="mR">
    <button class="btn" id="btnTour" style="font-size:26px;padding:14px"><span data-t>🏆 TOURNAMENT</span><small id="tourSub">Fight 1 / 10</small></button>
    <button class="btn blue" id="btn2p" style="font-size:24px"><span data-t>👥 2 PLAYERS</span><small data-t>Same device · one button each</small></button>
    <div class="grid2">
      <button class="btn pink rel" id="btnSkins"><span data-t>🎩 Wardrobe</span><i class="badge" id="skinBadge">!</i></button>
      <button class="btn green rel" id="btnDaily"><span data-t>🎁 Daily</span><i class="badge" id="dailyBadge">!</i></button>
      <button class="btn white" id="btnHow"><span data-t>❓ How to play</span></button>
      <button class="btn white" id="btnOpts"><span id="optTxt">🔊 Sound</span></button>
    </div>
    <button class="btn white" id="btnLang" style="font-size:16px;padding:8px">🌐 Français</button>
  </div>
</div></div>

<div class="overlay" id="scrVs"><div class="card">
  <h1 id="vsTitle">Fight 1</h1>
  <div class="ladder" id="ladder"></div>
  <div class="vs"><canvas id="vsA" width="220" height="220"></canvas><b>VS</b><canvas id="vsB" width="220" height="220"></canvas></div>
  <div class="muted" id="vsNames"></div>
  <button class="btn" id="vsGo" style="font-size:26px"><span data-t>🥊 FIGHT!</span></button>
  <button class="btn white" data-back><span data-t>← Back</span></button>
</div></div>

<div class="overlay" id="scrSkins"><div class="card">
  <h1 data-t>🎩 Wardrobe</h1>
  <div class="coinBar"><span class="coin"></span><span class="coinsTxt">0</span></div>
  <div class="skins" id="skinGrid"></div>
  <button class="btn white" data-back><span data-t>← Back</span></button>
</div></div>

<div class="overlay" id="scrDaily"><div class="card">
  <h1 data-t>🎁 Daily gift</h1>
  <div class="muted" data-t>Come back every day — day 7 is a jackpot!</div>
  <div class="dgrid" id="dailyGrid"></div>
  <button class="btn green" id="dailyClaim">Claim</button>
  <button class="btn white" data-back><span data-t>← Back</span></button>
</div></div>

<div class="overlay" id="scrHow"><div class="card">
  <h1 data-t>❓ How to play</h1>
  <div id="howTxt" style="font-size:15px;line-height:1.45"></div>
  <div class="keys" id="howKeys"></div>
  <button class="btn white" data-back><span data-t>← Back</span></button>
</div></div>

<div class="overlay" id="scrPause"><div class="card">
  <h1 data-t>Paused</h1>
  <button class="btn" id="resumeBtn"><span data-t>▶ Resume</span></button>
  <button class="btn white" id="quitBtn"><span data-t>🏠 Menu</span></button>
  <button class="btn white" id="pSound">🔊 Sound</button>
</div></div>

<div class="overlay" id="scrEnd"><div class="card">
  <h1 id="endTitle">YOU WIN!</h1>
  <div class="vs"><canvas id="endA" width="220" height="220"></canvas></div>
  <div class="big" id="endScore">5 - 2</div>
  <div class="coinBar">+<span id="endCoins">0</span> <span class="coin"></span></div>
  <button class="btn purple" id="doubleBtn"><span data-t>🎬 Double coins</span><small data-t>Watch a short ad</small></button>
  <button class="btn pink" id="headBtn"><span data-t>🎬 Rematch with a 1-point head start</span><small data-t>Watch a short ad</small></button>
  <div class="grid2">
    <button class="btn" id="endNext">Next</button>
    <button class="btn white" id="endMenu"><span data-t>🏠 Menu</span></button>
  </div>
</div></div>

<div class="overlay" id="adScreen"><div class="adBox">
  <div style="font-size:13px;color:#ff8fb3;font-weight:700">AD · DEMO</div>
  <div style="font-size:54px;margin:8px 0">🍿</div>
  <div style="font-weight:700">Your ad here</div>
  <div style="font-size:12px;opacity:.7;margin:6px 0 10px">No real ads outside CrazyGames</div>
  <div class="big" id="adCount">3</div>
</div></div>

<script>
'use strict';
/* ===================== PLATFORM ===================== */
const CG = { on:false, sdk:null };
const ADS_ENABLED = true;
async function initPlatform(){ try{ if(window.CrazyGames && window.CrazyGames.SDK){ const sdk = window.CrazyGames.SDK; await Promise.race([sdk.init(), new Promise((_,r)=>setTimeout(()=>r('t'),5000))]); if(sdk.environment === 'crazygames' || sdk.environment === 'local'){ CG.on = true; CG.sdk = sdk; window.__cgOn = true; } } }catch(e){} }
function cg(fn){ if(!CG.on) return; try{ fn(CG.sdk); }catch(e){} }
let gpOn = false;
const gpStart = ()=>{ if(gpOn) return; gpOn = true; cg(s=>s.game.gameplayStart()); };
const gpStop  = ()=>{ if(!gpOn) return; gpOn = false; cg(s=>s.game.gameplayStop()); };
const happy = ()=> cg(s=>s.game.happytime());
const LS = (()=>{ const mem = {}; return {
  get(k){ try{ if(window.__cgOn && CrazyGames.SDK.data){ const v = CrazyGames.SDK.data.getItem(k); if(v !== null && v !== undefined) return v; } }catch(e){} try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ if(window.__cgOn && CrazyGames.SDK.data) CrazyGames.SDK.data.setItem(k,v); }catch(e){} try{ localStorage.setItem(k,v); }catch(e){ mem[k] = v; } } }; })();
const $ = id => document.getElementById(id);

/* ===================== I18N ===================== */
const FR = {
 '🏆 TOURNAMENT':'🏆 TOURNOI','👥 2 PLAYERS':'👥 2 JOUEURS','Same device · one button each':'Même appareil · un bouton chacun','🎩 Wardrobe':'🎩 Garde-robe','🎁 Daily':'🎁 Cadeau','❓ How to play':'❓ Comment jouer',
 '🥊 FIGHT!':'🥊 COMBAT !','← Back':'← Retour','🎁 Daily gift':'🎁 Cadeau du jour','Come back every day — day 7 is a jackpot!':'Reviens chaque jour — le jour 7 est un jackpot !',
 'Paused':'Pause','▶ Resume':'▶ Reprendre','🏠 Menu':'🏠 Menu','🎬 Double coins':'🎬 Doubler les pièces','Watch a short ad':'Regarde une courte pub','🎬 Rematch with a 1-point head start':'🎬 Revanche avec 1 point d’avance',
 'Fight {n} / {m}':'Combat {n} / {m}','Fight {n}':'Combat {n}','Champion mode':'Mode champion','Round {n}':'Manche {n}','Sound':'Son','Sound off':'Son coupé',
 'YOU WIN!':'GAGNÉ !','YOU LOSE!':'PERDU !','{p} WINS!':'{p} GAGNE !','Next fight':'Combat suivant','Retry':'Réessayer','Rematch':'Revanche','Claim':'Récupérer','Day {n}':'Jour {n}','Come back tomorrow!':'Reviens demain !',
 'You':'Toi','Player 1':'Joueur 1','Player 2':'Joueur 2','Equip':'Équiper','Equipped':'Équipé','Not enough coins':'Pas assez de pièces','{s} unlocked!':'{s} débloqué !',
 'TOURNAMENT CHAMPION!':'CHAMPION DU TOURNOI !','No ad available right now':'Aucune pub disponible pour le moment','Coins doubled!':'Pièces doublées !',
 'Hold to charge, release to leap & punch':'Maintiens pour charger, relâche pour bondir et frapper','Tap anywhere':'Touche n’importe où','Left side':'Côté gauche','Right side':'Côté droit',
 'Dojo':'Dojo','Frozen Lake':'Lac gelé','Moon Base':'Base lunaire','Bouncy Castle':'Château gonflable','Twin Islands':'Îles jumelles','Pillars':'Piliers','Crumbling Bridge':'Pont qui s’effondre','Windy Cliff':'Falaise venteuse','Bumper Ball':'Balle rebondissante','Wobbly Raft':'Radeau bancal',
 'BIG HEADS':'GROSSES TÊTES','TINY FIGHTERS':'MINI COMBATTANTS','MEGA GLOVES':'MÉGA GANTS','SUPER JUMP':'SUPER SAUT','HEAVY':'POIDS LOURDS',
 'MATCH POINT!':'BALLE DE MATCH !','Knock your rival off the arena!':'Fais tomber ton rival de l’arène !'
};
let LANG = (()=>{ try{ const l = localStorage.getItem('pw_lang'); if(l === 'fr' || l === 'en') return l; }catch(e){} return /^fr/i.test(navigator.language||'') ? 'fr' : 'en'; })();
function tr(s, v){ let t = (LANG === 'fr' && FR[s]) || s; if(v) for(const k in v) t = t.split('{'+k+'}').join(v[k]); return t; }
function applyLang(){
  document.querySelectorAll('[data-t]').forEach(el=>{ if(!el.dataset.en) el.dataset.en = el.textContent.trim(); el.textContent = tr(el.dataset.en); });
  $('btnLang').textContent = LANG === 'fr' ? '🌐 English' : '🌐 Français'; document.documentElement.lang = LANG;
  $('howTxt').innerHTML = LANG === 'fr' ?
   '🥊 <b>Un seul bouton !</b> Maintiens pour charger, relâche pour <b>bondir et donner un coup de gant</b> vers ton rival.<br>🌀 Appuie encore en l’air pour une <b>attaque tournoyante</b>.<br>🏝️ Fais tomber ton rival de l’arène pour marquer. Le premier à <b>5 points</b> gagne.<br>🎲 Chaque manche change d’arène : glace, lune, château gonflable, vent…' :
   '🥊 <b>One button!</b> Hold to charge, release to <b>leap and throw a glove punch</b> at your rival.<br>🌀 Press again in mid-air for a <b>spinning attack</b>.<br>🏝️ Knock your rival off the arena to score. First to <b>5 points</b> wins.<br>🎲 Every round is a new arena: ice, moon, bouncy castle, wind…';
  $('howKeys').innerHTML = `<div>🧑 ${tr('Player 1')}<br><kbd>W</kbd> / <kbd>Space</kbd><br>${tr('Left side')} 👆</div><div>🧑 ${tr('Player 2')}<br><kbd>↑</kbd> / <kbd>Enter</kbd><br>${tr('Right side')} 👆</div>`;
  if(save) renderMenu();
}

/* ===================== DATA ===================== */
const SKINS = [
  { id:'classic', n:'Classic', body:'#ffd7b0', belt:'#3d8bff', hat:'none', price:0 },
  { id:'band',   n:'Karate',   body:'#ffcfa1', belt:'#ffffff', hat:'band',   price:0 },
  { id:'cowboy', n:'Cowboy',   body:'#f2b98a', belt:'#a0522d', hat:'cowboy', price:150 },
  { id:'chef',   n:'Chef',     body:'#ffe0c4', belt:'#ff4d6d', hat:'chef',   price:150 },
  { id:'viking', n:'Viking',   body:'#f7c9a3', belt:'#6b4f2a', hat:'viking', price:250 },
  { id:'party',  n:'Party',    body:'#ffd7b0', belt:'#b9a2ff', hat:'party',  price:250 },
  { id:'pirate', n:'Pirate',   body:'#e8b48f', belt:'#1d1440', hat:'pirate', price:350 },
  { id:'wizard', n:'Wizard',   body:'#ffe6cf', belt:'#6b4cff', hat:'wizard', price:350 },
  { id:'prop',   n:'Propeller',body:'#ffd7b0', belt:'#ffcf3d', hat:'prop',   price:450 },
  { id:'crown',  n:'Royal',    body:'#ffd7b0', belt:'#ffcf3d', hat:'crown',  price:600 },
  { id:'alien',  n:'Alien',    body:'#9ff58f', belt:'#ff8fb3', hat:'antenna',price:700 },
  { id:'robot',  n:'Robot',    body:'#c9d6e8', belt:'#ff4d6d', hat:'robot',  price:800 },
  { id:'frog',   n:'Froggy',   body:'#7ee07e', belt:'#ffcf3d', hat:'frog',   price:900 },
  { id:'tophat', n:'Gentleman',body:'#ffd7b0', belt:'#1d1440', hat:'tophat', price:1000 },
  { id:'halo',   n:'Angel',    body:'#fff0e0', belt:'#ffffff', hat:'halo',   price:1200 },
  { id:'gold',   n:'Golden',   body:'#ffcf3d', belt:'#ff4d6d', hat:'crown',  price:2000 }
];
const RIVALS = [
  { n:'Tiny Tofu',      skin:'chef',   ai:0.15 },
  { n:'Bubba Bop',      skin:'band',   ai:0.25 },
  { n:'Captain Wobble', skin:'pirate', ai:0.35 },
  { n:'Mister Mochi',   skin:'party',  ai:0.45 },
  { n:'Lady Lasagna',   skin:'wizard', ai:0.52 },
  { n:'Rocky Roll',     skin:'cowboy', ai:0.6 },
  { n:'Nacho Ninja',    skin:'band',   ai:0.68, body:'#c98b5e', belt:'#1d1440' },
  { n:'Viking Vince',   skin:'viking', ai:0.76 },
  { n:'Robo Rumble',    skin:'robot',  ai:0.85 },
  { n:'The Grand Bonker', skin:'crown', ai:0.95, body:'#ffcf3d', belt:'#ff4d6d', big:true }

      if(step % 4 === 0) tone('triangle', bass[bar], t, 0.32, 0.4, mus);

    whoosh(){ if(ok()) noise(ac.currentTime, 0.22, 0.35, 1400, 0.8); },
    punch(power){ if(!ok()) return; const t = ac.currentTime; noise(t, 0.12, 0.6*power, 900, 0.7, null, 'lowpass'); tone('sine', 160, t, 0.18, 0.5*power, null, 60); tone('square', 900 + Math.random()*400, t, 0.05, 0.08); },
    thud(v){ if(ok()) tone('sine', 120, ac.currentTime, 0.12, Math.min(0.35, v), null, 50); },
    fall(){ if(ok()) tone('sine', 1100, ac.currentTime, 1.1, 0.25, null, 180); },
    cheer(){ if(!ok()) return; const t = ac.currentTime; noise(t, 1.4, 0.35, 1600, 0.4); noise(t + 0.1, 1.2, 0.2, 2600, 0.5); },
    bell(){ if(!ok()) return; const t = ac.currentTime; [1, 2.76, 5.4].forEach((m,i)=> tone('sine', 520*m, t, 1.2 - i*0.3, 0.25/(i+1))); },
    coin(){ if(!ok()) return; const t = ac.currentTime; tone('square', 1320, t, 0.06, 0.08); tone('square', 1760, t + 0.06, 0.1, 0.08); },
    win(){ if(!ok()) return; const t = ac.currentTime; [523,659,784,1046,1318].forEach((f,i)=> tone('triangle', f, t + i*0.09, 0.4, 0.25)); },
    lose(){ if(!ok()) return; const t = ac.currentTime; [392,370,349,330].forEach((f,i)=> tone('triangle', f, t + i*0.2, 0.45, 0.22)); },
    bad(){ if(ok()) tone('square', 150, ac.currentTime, 0.12, 0.1); }

})();

function applyImpulse(f, rx, ry, jx, jy){ f.vx += jx/f.mass; f.vy += jy/f.mass; f.w += cross(rx, ry, jx, jy)/f.I; }

/* actions */

  if(!world || world.state !== 'fight' || f.out) return; f.held = true;
  if(f.groundT < 0.1){ f.charging = true; f.charge = 0; }
  else if(!f.airUsed){ f.airUsed = true; startPunch(f, 0.35); f.vx += f.face*3/f.mass*f.mass**0.3; f.vy -= 2.2; f.w += f.face*5; Sound.whoosh(); }
}
function release(f){

  if(f.charging){ f.charging = false; const c = Math.min(1, f.charge/0.55); const opp = world.f[1 - f.idx]; f.face = Math.sign(opp.x - f.x) || f.face;

}

/* ===================== MAIN LOOP ===================== */
let last = 0, acc = 0, paused = false;
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - (last || t))/1000); last = t;
  const W = world;
  if(W && !paused){
    if(W.hitstop > 0){ W.hitstop -= dt; }
    else { acc += dt*W.slow; let n = 0; while(acc >= DT && n < 10){ step(DT); if(match && match.mode === 'tour'){ aiThink(W.f[1], DT, match.rival.ai); } if(demo) { aiThink(W.f[0], DT, 0.6); aiThink(W.f[1], DT, 0.6); } acc -= DT; n++; } }
    if(W.state === 'intro'){ W.introT -= dt; if(W.introT <= 0){ W.state = 'fight'; Sound.intensity(1); } }
    if(W.state === 'ko'){ W.koT += dt; W.slow = W.koT < 0.9 ? 0.3 : 1; if(W.koT > 1.1 && !W.done){ W.done = true; if(demo){ setTimeout(()=>{ if(demo) startDemo(); }, 600); } else finishRound(); } }
    if(W.shake > 0) W.shake = Math.max(0, W.shake - dt*2.5);
    crowdJump = Math.max(0, crowdJump - dt*0.6);
    camera(W, dt);
  }
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if(W){ drawSky(W, t); drawWorld(W, t, paused ? 0 : dt); }
}

$('btnHow').onclick = () => { Sound.unlock(); Sound.ui(); show('scrHow'); };
$('btnOpts').onclick = () => { save.sfx = !save.sfx; Sound.set(save.sfx); saveGame(); renderMenu(); Sound.ui(); };
$('pSound').onclick = () => { save.sfx = !save.sfx; Sound.set(save.sfx); saveGame(); $('pSound').textContent = save.sfx ? '🔊 ' + tr('Sound') : '🔇 ' + tr('Sound off'); };
$('btnLang').onclick = () => { LANG = LANG === 'fr' ? 'en' : 'fr'; try{ localStorage.setItem('pw_lang', LANG); }catch(e){} applyLang(); Sound.ui(); };
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { Sound.ui(); goMenu(); });
$('pauseBtn').onclick = () => { if(!match) return; paused = true; gpStop(); $('pSound').textContent = save.sfx ? '🔊 ' + tr('Sound') : '🔇 ' + tr('Sound off'); show('scrPause'); };
$('resumeBtn').onclick = () => { paused = false; show(null); gpStart(); Sound.ui(); };
$('quitBtn').onclick = () => { paused = false; goMenu(); };
$('endMenu').onclick = () => { Sound.ui(); goMenu(); };
$('endNext').onclick = () => { Sound.ui(); const m = match; midgameThen(()=>{ if(m.mode === '2p') startMatch('2p'); else openVs(); }); };
$('doubleBtn').onclick = () => { const m = match; if(!m || m.doubled) return; showAd('rewarded', ()=>{ m.doubled = true; save.coins += m.coins; saveGame(); $('endCoins').textContent = m.coins*2; $('doubleBtn').style.display = 'none'; toast(tr('Coins doubled!')); Sound.coin(); }); };
$('headBtn').onclick = () => { showAd('rewarded', ()=>{ vsRival = match.rival; startMatch('tour', true); }); };
function goMenu(){ match = null; gpStop(); Sound.intensity(0); startDemo(); renderMenu(); show('scrMenu'); }
document.addEventListener('visibilitychange', () => { if(document.hidden){ Sound.suspend(); if(match && !paused && cur === null) $('pauseBtn').onclick(); } else Sound.resume(); });

/* demo fight behind the menu (AI vs AI) */
function startDemo(){ demo = true; const a = new Fighter(0, null, lookOf(save ? save.skin : 'classic')), b = new Fighter(1, null, lookOf('viking'));
  world = makeArena(Math.floor(Math.random()*ARENAS.length)); for(const [i, f] of [[0, a], [1, b]]){ f.reset(spawnX(world, i), i ? -1 : 1); f.setMods([]); world.f.push(f); } world.state = 'fight'; }

/* ===================== INIT ===================== */
async function init(){
  document.body.classList.add('adbusy');
  await initPlatform(); cg(s => s.game.loadingStart());
  cg(sdk => { const ap = st => { window.__platformMuted = !!(st && st.muteAudio); Sound.mute(false); }; if(sdk.game.settings) ap(sdk.game.settings); if(sdk.game.addSettingsChangeListener) sdk.game.addSettingsChangeListener(ap); });
  save = loadSave(); Sound.set(save.sfx);
  layout(); addEventListener('resize', ()=>{ layout(); if(cur) fitCard(cur); }); applyLang();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(cur) fitCard(cur); if(cur === 'scrMenu') renderMenu(); });
  requestAnimationFrame(frame);
  cg(s => s.game.loadingStop()); document.body.classList.remove('adbusy');
  if(save.stats.matches === 0){ vsRival = RIVALS[0]; startMatch('tour'); return; } // first visit: fight right away
  startDemo(); renderMenu(); show('scrMenu');
}
init();
window.__pw = { arena(i, mods){ world = makeArena(i); world.mods = mods || []; match.fighters.forEach((f, k) => { f.reset(spawnX(world, k), k ? -1 : 1); f.setMods(world.mods); world.f.push(f); }); world.state = 'fight'; return world; }, get world(){ return world; }, get match(){ return match; }, get save(){ return save; }, press, release, step, startMatch, aiThink, get cur(){ return cur; }, set paused(v){ paused = v; } };
</script>
</body>
</html>
